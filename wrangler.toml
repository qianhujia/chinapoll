name = "chinapoll-worker"
main = "worker/index.ts"
compatibility_date = "2026-10-08"

[triggers]
crons = ["0 * * * *"]

[durable_objects]
bindings = [
  { name = "RATE_LIMITER", class_name = "RateLimiter" },
  { name = "PASSWORD_HASHER", class_name = "PasswordHasher" },
  { name = "VIEW_COUNTER", class_name = "ViewCounter" }
]

# Durable Object migration list. This is unrelated to the D1 migrations_table
# setting below, which names the D1 tracking table. All classes are SQLite-backed
# (`new_sqlite_classes`); nothing has been deployed yet, so the single `v1` tag
# declares them in their final storage backend.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter", "PasswordHasher", "ViewCounter"]

[assets]
directory = "./dist/web"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Every request goes through the Worker so the HTML document receives its Content
# Security Policy on every route, including deep links such as /poll/12.
run_worker_first = true

# Cloudflare Workers AI, used only by the optional AI assistance endpoints. The
# feature is off unless the `ai_enable` setting is turned on.
[ai]
binding = "AI"

[vars]

[[d1_databases]]
binding = "DB"
database_name = "chinapoll-local"
database_id = "local"
migrations_dir = "./migrations"
migrations_table = "migrations"

# Production environment targeted by the deploy workflow with `--env production`.
#
# The D1 binding is declared by database *name* only: wrangler resolves the real
# database UUID through the API at deploy time, so no account-specific id is
# committed to the repository. Migrations are applied the same way:
#   npx wrangler d1 migrations apply chinapoll --remote
# `name` is pinned so the environment deploy targets the same Worker the Deploy
# button creates.
[env.production]
name = "chinapoll-worker"

[[env.production.d1_databases]]
binding = "DB"
database_name = "chinapoll"
migrations_dir = "./migrations"
migrations_table = "migrations"

# vars and durable_objects are not inherited from the top level, so they are
# repeated here. The Durable Object migration list and the AI binding are per
# environment as well.
[env.production.vars]

[env.production.durable_objects]
bindings = [
  { name = "RATE_LIMITER", class_name = "RateLimiter" },
  { name = "PASSWORD_HASHER", class_name = "PasswordHasher" },
  { name = "VIEW_COUNTER", class_name = "ViewCounter" }
]

[env.production.ai]
binding = "AI"

[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter", "PasswordHasher", "ViewCounter"]
