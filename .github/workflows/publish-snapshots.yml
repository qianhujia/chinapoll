name: Publish snapshots

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Checkout data repository
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.DATA_REPOSITORY }}
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data
      - name: Fetch published snapshots
        env:
          API_BASE: ${{ secrets.CHINAPOLL_API }}
          DATA_REPO_PATH: data
        run: node scripts/publish-snapshots.mjs
      - name: Commit snapshots
        working-directory: data
        run: |
          git config user.name 'chinapoll-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo "No snapshot changes."
          else
            git commit -m "Update published snapshots"
            git push
          fi