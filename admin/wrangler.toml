# Standalone admin Worker for ChinaPoll.
#
# This Worker is deployed separately from the public application Worker and
# binds to the same D1 database. It serves the browser dashboard and the
# /api/admin/* JSON endpoints used to review submissions, moderate comments,
# manage admin users, review the audit log, and manage settings.
#
# Deploy:
#   npx wrangler deploy --config admin/wrangler.toml

name = "chinapoll-admin-worker"
main = "index.ts"
compatibility_date = "2026-10-08"

# Local development only: every local command passes `--local`, so this
# placeholder never reaches the Cloudflare API.
[[d1_databases]]
binding = "DB"
database_name = "chinapoll-local"
database_id = "local"
migrations_dir = "../migrations"
migrations_table = "migrations"

# Production environment targeted by the deploy workflow with `--env production`.
#
# The D1 binding is declared by database *name* only: wrangler resolves the real
# database UUID through the API at deploy time, so no account-specific id is
# committed to the repository. Migrations are applied the same way:
#   npx wrangler d1 migrations apply chinapoll --env production --remote
# `name` is pinned so the environment deploy targets the same Worker the Deploy
# button creates.
[env.production]
name = "chinapoll-admin-worker"
workers_dev = false

[[env.production.d1_databases]]
binding = "DB"
database_name = "chinapoll"
migrations_dir = "../migrations"
migrations_table = "migrations"

# vars and durable_objects are not inherited from the top level, so they are
# repeated here. The Durable Object migration list is per environment.
[env.production.vars]

[env.production.durable_objects]
bindings = [
  { name = "RATE_LIMITER", class_name = "RateLimiter" },
  { name = "PASSWORD_HASHER", class_name = "PasswordHasher" }
]

[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter", "PasswordHasher"]

[vars]
# Public Turnstile site key used to render the login widget. The login form
# requires a solved token only when both this key and TURNSTILE_SECRET_KEY are
# set; store the secret with
#   npx wrangler secret put TURNSTILE_SECRET_KEY --config admin/wrangler.toml --env production
# TURNSTILE_SITE_KEY = "0x4AAAAAAA..."
# Optional: allow cookie-authenticated mutations from an additional origin.
# ADMIN_ORIGIN = "https://admin.chinapoll.org"
# Optional: origin of the public site, used to link a report row to its poll.
# PUBLIC_SITE_ORIGIN = "https://chinapoll.org"

# Shared rate limiter and password hasher. These are separate Durable Object
# namespaces from the public Worker's.
[durable_objects]
bindings = [
  { name = "RATE_LIMITER", class_name = "RateLimiter" },
  { name = "PASSWORD_HASHER", class_name = "PasswordHasher" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter", "PasswordHasher"]

